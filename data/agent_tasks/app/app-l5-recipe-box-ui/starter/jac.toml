[project]
name = "recipe_box_ui"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.36.1"

[dependencies]
[dependencies.npm]
jac-client-node = "1.0.7"

[dependencies.npm.dev]
"@jac-client/dev-deps" = "1.0.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]

[scale]
[scale.microservices]
[scale.microservices.routes]
endpoints = "/endpoints"
