<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef1f5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    height: 100%;
    max-height: 760px;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  }
  header {
    padding: 14px 18px;
    background: #2b3a55;
    color: #fff;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; }
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 72%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2b3a55;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #e4e9f0;
    color: #1f2933;
    border-bottom-left-radius: 4px;
  }
  .msg.pending { opacity: 0.75; }
  .msg.sent { opacity: 1; }
  .msg.failed {
    background: #fff0f0;
    color: #b91c1c;
  }
  .msg.bot.failed { background: #e4e9f0; color: #1f2933; }
  .meta {
    font-size: 11px;
    opacity: 0.7;
    margin-top: 4px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    align-items: center;
  }
  .spinner {
    display: inline-block;
    width: 8px; height: 8px;
    border: 2px solid #9ca3af;
    border-top-color: #2b3a55;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry {
    border: none;
    background: #b91c1c;
    color: #fff;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .retry:hover { background: #9b1b1b; }
  .pill {
    align-self: center;
    background: #2b3a55;
    color: #fff;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    margin: 6px 0;
    animation: pop 0.2s ease;
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  footer {
    padding: 12px 14px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 10px;
    align-items: center;
    background: #fff;
    flex: 0 0 auto;
  }
  #composer {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  #composer:focus { border-color: #2b3a55; }
  #send {
    border: none;
    background: #2b3a55;
    color: #fff;
    padding: 10px 18px;
    border-radius: 22px;
    cursor: pointer;
    font-weight: 600;
  }
  #send:hover { background: #23304a; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="dot"></span>
      Chat
    </header>
    <div id="messages"></div>
    <footer>
      <input id="composer" placeholder="Type a message..." autocomplete="off">
      <button id="send">Send</button>
    </footer>
  </div>
  <script>
    (function () {
      const messagesEl = document.getElementById('messages');
      const composer = document.getElementById('composer');
      const sendBtn = document.getElementById('send');
      const LATENCY = 800;
      const REPLY_DELAY = 1000;
      const FAIL_RATE = 0.25;
      const NEAR_BOTTOM = 60;

      let nearBottom = true;
      let pendingTimers = [];

      function scrollToBottom() {
        nearBottom = true;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function updateNearBottom() {
        const atBottom = (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) <= NEAR_BOTTOM;
        if (atBottom) {
          nearBottom = true;
          removePill();
        } else {
          nearBottom = false;
        }
      }

      messagesEl.addEventListener('scroll', updateNearBottom);

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return {
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
          }[c];
        });
      }

      function createMessageEl(text, type, metaContent) {
        const el = document.createElement('div');
        el.className = 'msg ' + type;
        el.innerHTML =
          '<div class="bubble">' + escapeHtml(text) + '</div>' +
          '<div class="meta">' + (metaContent || '') + '</div>';
        return el;
      }

      function removePill() {
        const pill = messagesEl.querySelector('.pill');
        if (pill) pill.remove();
      }

      function showPill() {
        removePill();
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.textContent = 'New messages';
        messagesEl.appendChild(pill);
      }

      function onNewMessage() {
        if (nearBottom) {
          scrollToBottom();
        } else {
          showPill();
        }
      }

      function addBotReply(text) {
        const el = createMessageEl(text, 'bot', 'sent');
        messagesEl.appendChild(el);
        onNewMessage();
      }

      function send() {
        const text = composer.value.trim();
        if (!text) return;
        removePill();
        const el = createMessageEl(text, 'user', '<span class="spinner"></span>');
        el.id = 'msg-' + Date.now() + '-' + Math.random().toString(3).slice(2);
        messagesEl.appendChild(el);
        onNewMessage();
        scheduleSend(el, text);
        composer.value = '';
        composer.focus();
      }

      function scheduleSend(el, text) {
        const t1 = setTimeout(function () {
          el.classList.remove('pending');
          el.classList.add('sent');
          el.querySelector('.meta').textContent = 'sent';
          if (Math.random() < FAIL_RATE) {
            el.classList.remove('sent');
            el.classList.add('failed');
            el.querySelector('.meta').textContent = 'failed';
            const btn = document.createElement('button');
            btn.className = 'retry';
            btn.textContent = 'Retry';
            btn.addEventListener('click', function () { retry(el); });
            el.querySelector('.meta').appendChild(btn);
          } else {
            const t2 = setTimeout(function () {
              addBotReply('Echo: ' + text);
            }, REPLY_DELAY);
            pendingTimers.push(t2);
          }
        }, LATENCY);
        pendingTimers.push(t1);
      }

      function retry(el) {
        el.remove();
        send();
      }

      function handleSend() {
        send();
      }

      sendBtn.addEventListener('click', handleSend);
      composer.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') handleSend();
      });

      addBotReply('Hello! Send me a message and I will echo it back.');
    })();
  </script>
</body>
</html>
